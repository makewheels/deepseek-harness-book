<svg viewBox="0 0 760 430" width="760" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <rect x="46" y="44" width="164" height="52" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="128" y="76" text-anchor="middle" font-size="15" fill="#20242e">create：写入目标</text>
  <line x1="210" y1="70" x2="286" y2="70" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="248" y="60" text-anchor="middle" font-size="13.5" fill="#5a6072">修订号 1</text>
  <rect x="290" y="40" width="180" height="60" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="380" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">active 进行中</text>
  <text x="380" y="88" text-anchor="middle" font-size="13.5" fill="#5a6072">Goal Round 在此消耗</text>
  <line x1="312" y1="100" x2="186" y2="178" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="222" y="128" font-size="13.5" fill="#5a6072">pause</text>
  <line x1="212" y1="182" x2="336" y2="104" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="292" y="168" font-size="13.5" fill="#5a6072">resume</text>
  <rect x="80" y="180" width="170" height="60" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="165" y="206" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">paused 暂停</text>
  <text x="165" y="228" text-anchor="middle" font-size="13.5" fill="#5a6072">续行停用，回头继续</text>
  <line x1="448" y1="100" x2="572" y2="178" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="524" y="128" font-size="13.5" fill="#5a6072">block</text>
  <line x1="548" y1="182" x2="424" y2="104" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="470" y="168" font-size="13.5" fill="#5a6072">resume（清理由）</text>
  <rect x="494" y="180" width="186" height="76" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="587" y="206" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">blocked 卡住了</text>
  <text x="587" y="228" text-anchor="middle" font-size="13.5" fill="#b26a00">必须写：策略代码</text>
  <text x="587" y="246" text-anchor="middle" font-size="13.5" fill="#b26a00">＋一段说明，不许沉默</text>
  <line x1="380" y1="100" x2="380" y2="316" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="394" y="214" font-size="13.5" fill="#5a6072">complete</text>
  <rect x="290" y="320" width="180" height="56" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="380" y="344" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">complete 完成</text>
  <text x="380" y="366" text-anchor="middle" font-size="13.5" fill="#5a6072">目标达成，证据说话</text>
  <text x="380" y="408" text-anchor="middle" font-size="14.5" fill="#5a6072">每次变更都是一条 goal/change 日志，带修订号；重启后靠回放原样恢复</text>
</svg>
