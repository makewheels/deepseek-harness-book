<svg viewBox="0 0 920 330" width="920" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="920" height="330" fill="#ffffff"/>
  <rect x="30" y="60" width="360" height="210" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="210" y="92" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#20242e">上下文窗口 = 一张小书桌</text>
  <line x1="50" y1="106" x2="370" y2="106" stroke="#c3c9e6" stroke-width="1.4"/>
  <text x="210" y="134" text-anchor="middle" font-size="14" fill="#5a6072">固定摆放：系统提示词、工作区指令</text>
  <text x="210" y="164" text-anchor="middle" font-size="14" fill="#5a6072">最近对话的来龙去脉</text>
  <text x="210" y="194" text-anchor="middle" font-size="14" fill="#5a6072">工具刚交回来的结果</text>
  <text x="210" y="234" text-anchor="middle" font-size="13.5" fill="#b26a00">桌子就那么大，摆满了就放不下新东西</text>
  <rect x="560" y="40" width="320" height="100" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="720" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">spill 仓库</text>
  <text x="720" y="98" text-anchor="middle" font-size="13.5" fill="#5a6072">超大工具输出搬进仓库</text>
  <text x="720" y="120" text-anchor="middle" font-size="13.5" fill="#5a6072">桌上只留一张取货单</text>
  <rect x="560" y="190" width="320" height="100" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="720" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">compaction 压缩</text>
  <text x="720" y="248" text-anchor="middle" font-size="13.5" fill="#5a6072">陈年对话压成一段摘要</text>
  <text x="720" y="270" text-anchor="middle" font-size="13.5" fill="#5a6072">原文不删，只是被摘要遮住</text>
  <path d="M392,120 C470,100 500,90 556,88" fill="none" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <path d="M392,210 C470,230 500,238 556,240" fill="none" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="474" y="78" text-anchor="middle" font-size="13.5" fill="#5a6072">结果太大</text>
  <text x="474" y="266" text-anchor="middle" font-size="13.5" fill="#5a6072">历史太长</text>
</svg>
