<svg viewBox="0 0 920 250" width="920" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="920" height="250" fill="#ffffff"/>
  <rect x="30" y="70" width="260" height="120" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="160" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">路线一：轻改装</text>
  <text x="160" y="132" text-anchor="middle" font-size="13.5" fill="#5a6072">在 cordis.patch.yml 里</text>
  <text x="160" y="154" text-anchor="middle" font-size="13.5" fill="#5a6072">按 id 换掉某个条目</text>
  <text x="160" y="176" text-anchor="middle" font-size="13" fill="#5a6072">成本：几行配置</text>
  <line x1="292" y1="130" x2="326" y2="130" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <rect x="330" y="70" width="260" height="120" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="460" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">路线二：新配方</text>
  <text x="460" y="132" text-anchor="middle" font-size="13.5" fill="#5a6072">建一个新 profile</text>
  <text x="460" y="154" text-anchor="middle" font-size="13.5" fill="#5a6072">换一整套 bundle 组合</text>
  <text x="460" y="176" text-anchor="middle" font-size="13" fill="#5a6072">成本：一份清单</text>
  <line x1="592" y1="130" x2="626" y2="130" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <rect x="630" y="70" width="260" height="120" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="760" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">路线三：preset</text>
  <text x="760" y="132" text-anchor="middle" font-size="13.5" fill="#b26a00">同一辆车，按会话</text>
  <text x="760" y="154" text-anchor="middle" font-size="13.5" fill="#b26a00">装出不同的 agent</text>
  <text x="760" y="176" text-anchor="middle" font-size="13" fill="#5a6072">成本：一份 preset 配置</text>
  <text x="460" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">改装三部曲：越往右，动作越大</text>
  <text x="460" y="226" text-anchor="middle" font-size="14.5" fill="#5a6072">随时 --dump-config 检查成品；--patch 还能临时加一层，不动原车</text>
</svg>
