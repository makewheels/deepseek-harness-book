<svg viewBox="0 0 900 320" width="900" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#20242e">第一个插件：四步上车</text>

  <rect x="30" y="70" width="190" height="150" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="125" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">① 写挂载代码</text>
  <text x="125" y="132" text-anchor="middle" font-size="13.5" fill="#5a6072">一个 TS 模块</text>
  <text x="125" y="156" text-anchor="middle" font-size="13.5" fill="#5a6072">导出 apply(ctx)</text>
  <text x="125" y="184" text-anchor="middle" font-size="13.5" fill="#5a6072">my-plugin.ts</text>

  <rect x="255" y="70" width="190" height="150" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="350" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">② 写配置条目</text>
  <text x="350" y="132" text-anchor="middle" font-size="13.5" fill="#5a6072">cordis.yml 里一行</text>
  <text x="350" y="156" text-anchor="middle" font-size="13.5" fill="#5a6072">insert：id + 绝对路径</text>
  <text x="350" y="184" text-anchor="middle" font-size="13.5" fill="#5a6072">可选 config 参数</text>

  <rect x="480" y="70" width="190" height="150" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="575" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">③ 带覆盖层启动</text>
  <text x="575" y="136" text-anchor="middle" font-size="13.5" fill="#5a6072">pnpm dsh web</text>
  <text x="575" y="160" text-anchor="middle" font-size="13.5" fill="#5a6072">--patch ./scratch-plugin/</text>
  <text x="575" y="184" text-anchor="middle" font-size="13.5" fill="#5a6072">cordis.yml</text>

  <rect x="705" y="70" width="165" height="150" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="787" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">④ 验收</text>
  <text x="787" y="132" text-anchor="middle" font-size="13.5" fill="#b26a00">终端打印</text>
  <text x="787" y="156" text-anchor="middle" font-size="13.5" fill="#b26a00">插件加载日志</text>
  <text x="787" y="184" text-anchor="middle" font-size="13.5" fill="#b26a00">127.0.0.1:3080</text>

  <line x1="222" y1="145" x2="252" y2="145" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="447" y1="145" x2="477" y2="145" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="672" y1="145" x2="702" y2="145" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arw)"/>

  <text x="450" y="266" text-anchor="middle" font-size="14.5" fill="#5a6072">插件 = 配置条目 + 挂载代码 + apply 里登记的贡献；卸载时框架自动清理一切注册</text>
</svg>
