<svg viewBox="0 0 760 810" width="760" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="760" height="810" fill="#ffffff"/>
  <rect x="230" y="14" width="300" height="48" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="380" y="44" text-anchor="middle" font-size="15" fill="#20242e">模型消息里带着工具调用</text>
  <line x1="380" y1="62" x2="380" y2="80" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="230" y="84" width="300" height="48" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="380" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">tool/call 先记入日志</text>
  <line x1="380" y1="132" x2="380" y2="150" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="205" y="154" width="350" height="58" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="380" y="178" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">关卡① pre-execute</text>
  <text x="380" y="200" text-anchor="middle" font-size="13.5" fill="#5a6072">钩子 · 权限 · 沙箱 → 放行 / 拒绝 / 要审批</text>
  <line x1="380" y1="212" x2="380" y2="230" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="394" y="226" font-size="13" fill="#5a6072">要审批</text>
  <rect x="230" y="234" width="300" height="58" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="380" y="258" text-anchor="middle" font-size="15" fill="#20242e">审批弹窗（问你一次）</text>
  <text x="380" y="280" text-anchor="middle" font-size="13.5" fill="#b26a00">没人能回答 = 按拒绝处理</text>
  <line x1="380" y1="292" x2="380" y2="310" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <text x="394" y="306" font-size="13" fill="#5a6072">批准</text>
  <rect x="205" y="314" width="350" height="58" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="380" y="338" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">关卡② 单调守卫</text>
  <text x="380" y="360" text-anchor="middle" font-size="13.5" fill="#5a6072">铁规矩守卫：不能绕过、不能重排</text>
  <line x1="380" y1="372" x2="380" y2="390" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="230" y="394" width="300" height="58" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="380" y="418" text-anchor="middle" font-size="15" fill="#20242e">执行包装：超时 · 重试 · 计时</text>
  <text x="380" y="440" text-anchor="middle" font-size="13.5" fill="#5a6072">包住真正的工具本体</text>
  <line x1="380" y1="452" x2="380" y2="470" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="230" y="474" width="300" height="48" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="380" y="504" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">文件专属：先看过，才许改</text>
  <line x1="380" y1="522" x2="380" y2="540" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="205" y="544" width="350" height="58" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="380" y="568" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">关卡③ post-execute</text>
  <text x="380" y="590" text-anchor="middle" font-size="13.5" fill="#5a6072">接收 · 拦截 · 替换结果 · 补充上下文</text>
  <line x1="380" y1="602" x2="380" y2="620" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="230" y="624" width="300" height="48" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="380" y="654" text-anchor="middle" font-size="15" fill="#20242e">结果冻结（不可再改）</text>
  <line x1="380" y1="672" x2="380" y2="690" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="230" y="694" width="300" height="58" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="380" y="718" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">tool/result 记入日志</text>
  <text x="380" y="740" text-anchor="middle" font-size="13.5" fill="#5a6072">模型看到的唯一结果</text>
  <line x1="558" y1="183" x2="640" y2="183" stroke="#9aa4d6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="648" y="178" font-size="13" fill="#5a6072">拒绝 →</text>
  <text x="648" y="196" font-size="13" fill="#5a6072">跳过执行</text>
  <text x="648" y="214" font-size="13" fill="#5a6072">照样进关卡③</text>
  <text x="380" y="784" text-anchor="middle" font-size="14.5" fill="#5a6072">任何一步抛错，都会被规范成"错误结果"——不会把循环搞崩</text>
</svg>
