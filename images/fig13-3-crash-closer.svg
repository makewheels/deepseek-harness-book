<svg viewBox="0 0 920 340" width="920" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="920" height="340" fill="#ffffff"/>
  <rect x="30" y="70" width="250" height="180" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="155" y="102" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">崩溃前 · 已入账</text>
  <line x1="50" y1="116" x2="260" y2="116" stroke="#c3c9e6" stroke-width="1.4"/>
  <text x="155" y="144" text-anchor="middle" font-size="13.5" fill="#5a6072">seq k&#160;&#160;tool/call 已持久化</text>
  <text x="155" y="172" text-anchor="middle" font-size="13.5" fill="#5a6072">步骤与轮次仍然开放</text>
  <text x="155" y="200" text-anchor="middle" font-size="13.5" fill="#5a6072">最后一批写到一半</text>
  <rect x="335" y="95" width="150" height="130" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="410" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">进程崩溃</text>
  <text x="410" y="178" text-anchor="middle" font-size="13.5" fill="#b26a00">烂尾现场</text>
  <rect x="540" y="70" width="350" height="180" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="715" y="102" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">重启加载 · 关账</text>
  <line x1="560" y1="116" x2="870" y2="116" stroke="#c3c9e6" stroke-width="1.4"/>
  <text x="560" y="144" font-size="13.5" fill="#5a6072">保留：已写事件一个不少</text>
  <text x="560" y="172" font-size="13.5" fill="#b26a00">补记：合成 tool/result（结果未知）</text>
  <text x="560" y="200" font-size="13.5" fill="#b26a00">补记：step/end + turn/end{interrupted}</text>
  <text x="560" y="228" font-size="13.5" fill="#5a6072">丢弃：只有没写全的撕裂碎片</text>
  <path d="M282,160 L332,160" fill="none" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <path d="M487,160 L537,160" fill="none" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="512" y="146" text-anchor="middle" font-size="13.5" fill="#5a6072">补齐</text>
  <text x="512" y="190" text-anchor="middle" font-size="13.5" fill="#5a6072">不砍</text>
  <text x="460" y="300" text-anchor="middle" font-size="13.5" fill="#b26a00">interrupted 只会由崩溃恢复合成 —— 失败显形，账本永远是平的</text>
</svg>
