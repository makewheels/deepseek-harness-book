  <line x1="704" y1="432" x2="436" y2="432" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="570" y="422" text-anchor="middle" font-size="14" fill="#20242e">干完了，这是结果</text>
  <line x1="424" y1="478" x2="146" y2="478" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="285" y="468" text-anchor="middle" font-size="14" fill="#20242e">显示整理结果</text>
