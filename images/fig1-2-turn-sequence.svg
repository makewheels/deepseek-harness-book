  <line x1="140" y1="74" x2="140" y2="530" stroke="#b9c0dd" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="430" y1="74" x2="430" y2="530" stroke="#b9c0dd" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="710" y1="74" x2="710" y2="530" stroke="#b9c0dd" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="146" y1="110" x2="424" y2="110" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="285" y="100" text-anchor="middle" font-size="14" fill="#20242e">整理我的桌面</text>
  <line x1="436" y1="156" x2="704" y2="156" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="570" y="146" text-anchor="middle" font-size="14" fill="#20242e">你的话 + 可用工具清单</text>
