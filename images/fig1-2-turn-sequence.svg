  <text x="570" y="192" text-anchor="middle" font-size="14" fill="#20242e">我要用「列目录」工具</text>
  <path d="M436,242 h80 v26 h-74" fill="none" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="528" y="260" font-size="14" fill="#20242e">执行工具，记入日志</text>
  <line x1="436" y1="294" x2="704" y2="294" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="570" y="284" text-anchor="middle" font-size="14" fill="#20242e">23 个文件的清单</text>
  <line x1="704" y1="340" x2="436" y2="340" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="570" y="330" text-anchor="middle" font-size="14" fill="#20242e">用「移动文件」把 8 张图片移走</text>
  <path d="M436,380 h80 v26 h-74" fill="none" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
