<svg viewBox="0 0 920 460" width="920" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#ffffff"/>

  <!-- 五个事件盒子 -->
  <rect x="30" y="40" width="160" height="100" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="110" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">compaction/start</text>
  <text x="110" y="98" text-anchor="middle" font-size="13.5" fill="#5a6072">获取锁</text>
  <text x="110" y="120" text-anchor="middle" font-size="13.5" fill="#5a6072">（仅日志）</text>

  <rect x="205" y="40" width="160" height="100" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="285" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">辅助调用写摘要</text>
  <text x="285" y="98" text-anchor="middle" font-size="13.5" fill="#5a6072">一次性调用</text>
  <text x="285" y="120" text-anchor="middle" font-size="13.5" fill="#5a6072">不走 agent 循环</text>

  <rect x="380" y="40" width="160" height="100" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="460" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">compaction/</text>
  <text x="460" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">summary</text>
  <text x="460" y="112" text-anchor="middle" font-size="13.5" fill="#5a6072">摘要与范围入账</text>

  <rect x="555" y="40" width="160" height="100" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="635" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">user/message</text>
  <text x="635" y="98" text-anchor="middle" font-size="13.5" fill="#5a6072">replace：旧范围→摘要</text>
  <text x="635" y="120" text-anchor="middle" font-size="13.5" fill="#b26a00">唯一的桌面变更</text>

  <rect x="730" y="40" width="160" height="100" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="810" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">compaction/end</text>
  <text x="810" y="98" text-anchor="middle" font-size="13.5" fill="#5a6072">释放锁</text>
  <text x="810" y="120" text-anchor="middle" font-size="13.5" fill="#5a6072">（仅日志）</text>

  <!-- 箭头 -->
  <path d="M192,90 L203,90" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw82)"/>
  <path d="M367,90 L378,90" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw82)"/>
  <path d="M542,90 L553,90" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw82)"/>
  <path d="M717,90 L728,90" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw82)"/>

  <!-- 锁括号 -->
  <path d="M30,172 L30,158 L890,158 L890,172" fill="none" stroke="#f9a825" stroke-width="2.2"/>
  <text x="460" y="196" text-anchor="middle" font-size="14.5" fill="#20242e">锁的范围：中途崩溃 ⇒「有 start 没 end」，施工牌留到下次启动</text>

  <!-- 桌面条 -->
  <rect x="30" y="222" width="860" height="96" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="50" y="252" font-size="15" font-weight="bold" fill="#20242e">压缩后，模型看到的桌面</text>
  <rect x="50" y="264" width="380" height="40" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
  <text x="240" y="290" text-anchor="middle" font-size="13.5" fill="#20242e">摘要检查点（替换了较早范围）</text>
  <rect x="450" y="264" width="320" height="40" rx="10" fill="#ffffff" stroke="#5c6bc0" stroke-width="1.4"/>
  <text x="610" y="290" text-anchor="middle" font-size="13.5" fill="#20242e">保留的近期尾部（逐字不动）</text>
  <text x="812" y="290" text-anchor="middle" font-size="13.5" fill="#b26a00">旧账：遮住</text>
  <text x="812" y="310" text-anchor="middle" font-size="13.5" fill="#b26a00">不是删除</text>

  <!-- 账本条 -->
  <rect x="30" y="342" width="860" height="88" rx="12" fill="#ffffff" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="50" y="372" font-size="15" font-weight="bold" fill="#20242e">账本（会话日志）：原文一字不删</text>
  <text x="50" y="400" font-size="13.5" fill="#5a6072">被遮住的事件原样在册，另加 compaction/* 记录——回放、审计随时可查</text>
  <text x="50" y="422" font-size="13.5" fill="#5a6072">摘要替代的只是桌面，不是历史</text>
</svg>
