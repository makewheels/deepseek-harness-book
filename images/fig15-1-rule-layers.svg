<svg viewBox="0 0 920 512" width="920" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="920" height="512" fill="#ffffff"/>

  <!-- 列头 -->
  <text x="52" y="26" font-size="13.5" fill="#5a6072">扩展点</text>
  <text x="350" y="26" font-size="13.5" fill="#5a6072">规则怎么被读到</text>
  <text x="660" y="26" font-size="13.5" fill="#5a6072">生命周期</text>

  <!-- 带 1：工作区指令 -->
  <rect x="30" y="42" width="860" height="78" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="52" y="76" font-size="15" font-weight="bold" fill="#20242e">工作区指令</text>
  <text x="52" y="100" font-size="13.5" fill="#5a6072">AGENTS.md 一族文件</text>
  <text x="350" y="76" font-size="13.5" fill="#20242e">第一次请求注入基线</text>
  <text x="350" y="100" font-size="13.5" fill="#5a6072">常驻书桌，具体优先</text>
  <text x="660" y="76" font-size="13.5" fill="#20242e">磁盘文件</text>
  <text x="660" y="100" font-size="13.5" fill="#5a6072">跟随项目走</text>

  <!-- 带 2：skill -->
  <rect x="30" y="134" width="860" height="78" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="52" y="168" font-size="15" font-weight="bold" fill="#20242e">skill</text>
  <text x="52" y="192" font-size="13.5" fill="#5a6072">SKILL.md 目录包或单文件</text>
  <text x="350" y="168" font-size="13.5" fill="#20242e">先见目录（名字＋描述）</text>
  <text x="350" y="192" font-size="13.5" fill="#5a6072">按需加载全文</text>
  <text x="660" y="168" font-size="13.5" fill="#20242e">磁盘文件</text>
  <text x="660" y="192" font-size="13.5" fill="#5a6072">改动热刷新</text>

  <!-- 带 3：hooks -->
  <rect x="30" y="226" width="860" height="78" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="52" y="260" font-size="15" font-weight="bold" fill="#20242e">hooks</text>
  <text x="52" y="284" font-size="13.5" fill="#5a6072">外部 shell 钩子脚本</text>
  <text x="350" y="260" font-size="13.5" fill="#20242e">按时刻触发，先于模型</text>
  <text x="350" y="284" font-size="13.5" fill="#5a6072">可阻塞、可附加上下文</text>
  <text x="660" y="260" font-size="13.5" fill="#20242e">独立脚本</text>
  <text x="660" y="284" font-size="13.5" fill="#5a6072">跨进程一直有效</text>

  <!-- 带 4：extensions（重点） -->
  <rect x="30" y="318" width="860" height="78" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="52" y="352" font-size="15" font-weight="bold" fill="#20242e">extensions</text>
  <text x="52" y="376" font-size="13.5" fill="#5a6072">模型现写的动态 Cordis 包</text>
  <text x="350" y="352" font-size="13.5" fill="#20242e">进程内试跑</text>
  <text x="350" y="376" font-size="13.5" fill="#5a6072">可监听事件、注册工具</text>
  <text x="660" y="352" font-size="13.5" fill="#20242e">仅进程内存</text>
  <text x="660" y="376" font-size="13.5" fill="#b26a00">重启即清＝天然试验田</text>

  <!-- 带 5：settings -->
  <rect x="30" y="410" width="860" height="78" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="52" y="444" font-size="15" font-weight="bold" fill="#20242e">settings</text>
  <text x="52" y="468" font-size="13.5" fill="#5a6072">namespace 结构化取值</text>
  <text x="350" y="444" font-size="13.5" fill="#20242e">注册的插件读解析值</text>
  <text x="350" y="468" font-size="13.5" fill="#5a6072">三层解析，用户层最高</text>
  <text x="660" y="444" font-size="13.5" fill="#20242e">YAML/JSON 文档</text>
  <text x="660" y="468" font-size="13.5" fill="#5a6072">热更新即时生效</text>
</svg>
