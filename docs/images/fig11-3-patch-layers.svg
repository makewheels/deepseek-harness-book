<svg viewBox="0 0 900 430" width="900" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#20242e">生效配置：四层 patch 从下往上叠</text>

  <rect x="180" y="330" width="500" height="56" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="430" y="356" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#20242e">第 1 层｜各组合包的 patch</text>
  <text x="430" y="376" text-anchor="middle" font-size="13.5" fill="#5a6072">按 bundles 列表顺序：先是 dsh-base，再按安装顺序</text>

  <rect x="180" y="258" width="500" height="56" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="430" y="284" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#20242e">第 2 层｜profile 自己的 cordis.patch.yml</text>
  <text x="430" y="304" text-anchor="middle" font-size="13.5" fill="#5a6072">这个 profile 的用户补丁</text>

  <rect x="180" y="186" width="500" height="56" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="430" y="212" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#20242e">第 3 层｜$DSH_HOME/cordis.patch.yml</text>
  <text x="430" y="232" text-anchor="middle" font-size="13.5" fill="#5a6072">各 profile 共享的机器本地偏好</text>

  <rect x="180" y="114" width="500" height="56" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#20242e">第 4 层｜--patch 覆盖层</text>
  <text x="430" y="160" text-anchor="middle" font-size="13.5" fill="#b26a00">按命令行顺序；本章教程用的就是它</text>

  <line x1="120" y1="360" x2="120" y2="150" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arw)"/>
  <text x="105" y="262" text-anchor="middle" font-size="13.5" fill="#5a6072" transform="rotate(-90 105 262)">应用越晚，层越高</text>

  <text x="450" y="80" text-anchor="middle" font-size="14.5" fill="#20242e">高层按行胜出：后应用的层按 id 覆盖前面的行，替换整行 config（不做深度合并）</text>
  <text x="450" y="410" text-anchor="middle" font-size="14" fill="#5a6072">装插件 = 往某一层加一行；卸载 = 把那行去掉——拔下来，一切恢复原状</text>
</svg>
