<svg viewBox="0 0 780 700" width="780" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="780" height="700" fill="#ffffff"/>
  <rect x="240" y="16" width="300" height="50" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="390" y="47" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">turn/start：打开一个轮次</text>
  <line x1="390" y1="66" x2="390" y2="86" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="240" y="90" width="300" height="50" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="390" y="121" text-anchor="middle" font-size="15" fill="#20242e">领取输入（你的话 + 排队消息）</text>
  <line x1="390" y1="140" x2="390" y2="160" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="240" y="164" width="300" height="50" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="390" y="195" text-anchor="middle" font-size="15" fill="#20242e">组装提示词片段 + 工具清单</text>
  <line x1="390" y1="214" x2="390" y2="234" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="240" y="238" width="300" height="50" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="390" y="262" text-anchor="middle" font-size="15" fill="#20242e">pre-step 关卡：可改写、可拒绝</text>
  <text x="390" y="282" text-anchor="middle" font-size="13" fill="#5a6072">首次领取被拒 → 直接关轮次</text>
  <line x1="390" y1="288" x2="390" y2="308" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="240" y="312" width="300" height="50" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="390" y="343" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">step/start：消息追加进日志</text>
  <line x1="390" y1="362" x2="390" y2="382" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="240" y="386" width="300" height="50" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="390" y="410" text-anchor="middle" font-size="15" fill="#20242e">请求模型 → 流式接收回答</text>
  <text x="390" y="428" text-anchor="middle" font-size="13" fill="#5a6072">assistant 消息写入日志</text>
  <line x1="390" y1="436" x2="390" y2="456" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="200" y="460" width="380" height="62" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="390" y="486" text-anchor="middle" font-size="15" fill="#20242e">工具调用过三道关卡（第6章）</text>
  <text x="390" y="508" text-anchor="middle" font-size="13" fill="#5a6072">结果写入日志，可能欠下新的模型请求</text>
  <line x1="390" y1="522" x2="390" y2="546" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <polygon points="390,550 530,596 390,642 250,596" fill="#fafbff" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="390" y="602" text-anchor="middle" font-size="15" fill="#20242e">还欠工作吗？</text>
  <path d="M250,596 H150 V337 H236" fill="none" stroke="#f9a825" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="140" y="470" text-anchor="middle" font-size="14" fill="#b26a00" transform="rotate(-90 140 470)">欠 → 下一个步骤</text>
  <line x1="530" y1="596" x2="586" y2="596" stroke="#5c6bc0" stroke-width="1.7" marker-end="url(#arw)"/>
  <rect x="590" y="571" width="170" height="50" rx="10" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="675" y="602" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">turn/end 收工</text>
</svg>
