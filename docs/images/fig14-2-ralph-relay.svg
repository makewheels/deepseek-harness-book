<svg viewBox="0 0 920 480" width="920" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw14b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#ffffff"/>

  <!-- 不可变目标 -->
  <rect x="280" y="28" width="360" height="64" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="460" y="54" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">一个不可变目标</text>
  <text x="460" y="78" text-anchor="middle" font-size="13.5" fill="#5a6072">一经给定全程不改，逐代原样下达</text>

  <!-- 共享工作区 -->
  <rect x="30" y="122" width="860" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="460" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">共享工作区（文件）＝唯一的跨代长期记忆</text>
  <text x="460" y="172" text-anchor="middle" font-size="13.5" fill="#5a6072">每代 agent 必须看文件核实，而不是相信叙述性的交接</text>
  <path d="M120,186 L120,224" fill="none" stroke="#5c6bc0" stroke-width="1.6" marker-end="url(#arw14b)"/>
  <text x="134" y="212" text-anchor="start" font-size="13.5" fill="#5a6072">读写文件</text>

  <!-- 接力的一代代 -->
  <rect x="35" y="230" width="170" height="104" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="120" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">第 1 代（全新）</text>
  <text x="120" y="288" text-anchor="middle" font-size="13.5" fill="#5a6072">没有对话种子</text>
  <text x="120" y="312" text-anchor="middle" font-size="13.5" fill="#5a6072">目标、轮号与上限</text>

  <rect x="255" y="230" width="170" height="104" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="340" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">第 2 代（全新）</text>
  <text x="340" y="288" text-anchor="middle" font-size="13.5" fill="#5a6072">目标、轮号与上限</text>
  <text x="340" y="312" text-anchor="middle" font-size="13.5" fill="#5a6072">＋上一代有界报告</text>

  <rect x="475" y="230" width="170" height="104" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="560" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">第 3 代（全新）</text>
  <text x="560" y="288" text-anchor="middle" font-size="13.5" fill="#5a6072">目标、轮号与上限</text>
  <text x="560" y="312" text-anchor="middle" font-size="13.5" fill="#5a6072">＋上一代有界报告</text>

  <rect x="695" y="230" width="170" height="104" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="780" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">第 N 代 …</text>
  <text x="780" y="288" text-anchor="middle" font-size="13.5" fill="#5a6072">一直接力下去</text>
  <text x="780" y="312" text-anchor="middle" font-size="13.5" fill="#5a6072">直到出现某个收场</text>

  <path d="M207,282 L251,282" fill="none" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw14b)"/>
  <text x="229" y="268" text-anchor="middle" font-size="13.5" fill="#5a6072">有界报告</text>
  <path d="M427,282 L471,282" fill="none" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw14b)"/>
  <text x="449" y="268" text-anchor="middle" font-size="13.5" fill="#5a6072">有界报告</text>
  <path d="M647,282 L691,282" fill="none" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw14b)"/>
  <text x="669" y="268" text-anchor="middle" font-size="13.5" fill="#5a6072">有界报告</text>

  <!-- 三种收场 -->
  <text x="35" y="372" text-anchor="start" font-size="15" font-weight="bold" fill="#20242e">三种收场</text>
  <rect x="35" y="384" width="190" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="130" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">complete</text>
  <text x="130" y="434" text-anchor="middle" font-size="13.5" fill="#5a6072">worker 报告完成</text>

  <rect x="245" y="384" width="190" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="340" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">blocked</text>
  <text x="340" y="434" text-anchor="middle" font-size="13.5" fill="#5a6072">报告了具体阻塞</text>

  <rect x="455" y="384" width="230" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.8"/>
  <text x="570" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#20242e">budget-limited</text>
  <text x="570" y="434" text-anchor="middle" font-size="13.5" fill="#5a6072">轮数用尽仍在继续</text>

  <rect x="705" y="374" width="180" height="84" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="795" y="400" text-anchor="middle" font-size="13.5" fill="#5a6072">完成与阻塞</text>
  <text x="795" y="422" text-anchor="middle" font-size="13.5" fill="#5a6072">都是 worker 的自我报告</text>
  <text x="795" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#b26a00">不是独立认证</text>
</svg>
