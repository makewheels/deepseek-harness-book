<svg viewBox="0 0 900 420" width="900" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
    <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9a825"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#20242e">scope 管可见性，lineage 只记血缘</text>

  <rect x="50" y="70" width="340" height="240" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="220" y="102" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">父 agent 的 scope</text>
  <rect x="80" y="122" width="280" height="36" rx="12" fill="#ffffff" stroke="#5c6bc0" stroke-width="1.4"/>
  <text x="220" y="145" text-anchor="middle" font-size="13.5" fill="#20242e">带作用域注册：定制工具 / 提示词段</text>
  <rect x="80" y="170" width="280" height="36" rx="12" fill="#ffffff" stroke="#5c6bc0" stroke-width="1.4"/>
  <text x="220" y="193" text-anchor="middle" font-size="13.5" fill="#20242e">全局工具照常可见</text>
  <text x="220" y="240" text-anchor="middle" font-size="13.5" fill="#5a6072">这些定制只归这个 scope 所有</text>
  <text x="220" y="266" text-anchor="middle" font-size="13.5" fill="#b26a00">不向下继承给子代理</text>

  <rect x="510" y="70" width="340" height="240" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="680" y="102" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#20242e">子 agent 的 scope</text>
  <rect x="540" y="122" width="280" height="36" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
  <text x="680" y="145" text-anchor="middle" font-size="13.5" fill="#20242e">全新的扁平 scope，从零开始</text>
  <rect x="540" y="170" width="280" height="36" rx="12" fill="#ffffff" stroke="#5c6bc0" stroke-width="1.4"/>
  <text x="680" y="193" text-anchor="middle" font-size="13.5" fill="#20242e">要定制？在自己的 scope 里重新注册</text>
  <text x="680" y="240" text-anchor="middle" font-size="13.5" fill="#5a6072">委派深度持久记录：父级深度 + 1</text>
  <text x="680" y="266" text-anchor="middle" font-size="13.5" fill="#5a6072">冷恢复也降不下来</text>

  <line x1="394" y1="150" x2="506" y2="150" stroke="#f9a825" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arwA)"/>
  <text x="450" y="136" text-anchor="middle" font-size="13.5" fill="#b26a00">lineage：血缘是数据</text>
  <text x="450" y="176" text-anchor="middle" font-size="13.5" fill="#b26a00">parentSession、delegationDepth</text>

  <rect x="120" y="336" width="660" height="52" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="450" y="368" text-anchor="middle" font-size="14.5" fill="#20242e">可见性由 scope 决定，血缘只是随行的档案——谁生的谁、委派到第几层，从不影响谁能看见什么</text>
</svg>
