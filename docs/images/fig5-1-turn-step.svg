<svg viewBox="0 0 940 310" width="940" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="940" height="310" fill="#ffffff"/>
  <rect x="30" y="52" width="880" height="200" rx="16" fill="#fafbff" stroke="#9aa4d6" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="54" y="82" font-size="15" font-weight="bold" fill="#5a6072">一个轮次（turn）：从领到任务，到不再欠任何工作</text>
  <rect x="60" y="106" width="250" height="112" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="185" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">步骤 1</text>
  <text x="185" y="164" text-anchor="middle" font-size="14" fill="#5a6072">1 次模型请求</text>
  <text x="185" y="190" text-anchor="middle" font-size="14" fill="#5a6072">+ 它调用的工具</text>
  <rect x="345" y="106" width="250" height="112" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="1.6"/>
  <text x="470" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">步骤 2</text>
  <text x="470" y="164" text-anchor="middle" font-size="14" fill="#5a6072">1 次模型请求</text>
  <text x="470" y="190" text-anchor="middle" font-size="14" fill="#5a6072">+ 它调用的工具</text>
  <rect x="630" y="106" width="250" height="112" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="755" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#20242e">步骤 N</text>
  <text x="755" y="164" text-anchor="middle" font-size="14" fill="#5a6072">最后一次请求</text>
  <text x="755" y="190" text-anchor="middle" font-size="14" fill="#b26a00">不再调用工具 → 收工</text>
  <line x1="312" y1="162" x2="341" y2="162" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="597" y1="162" x2="626" y2="162" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="470" y="286" text-anchor="middle" font-size="14.5" fill="#5a6072">一个轮次 = 零个或多个步骤；工具欠着新请求，或来了新输入，就开下一个步骤</text>
</svg>
